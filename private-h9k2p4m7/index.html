<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Gallery Admin · Ysabelle BD</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fff8f3;
    --bg-2: #f9e8f1;
    --ink: #4a3344;
    --ink-soft: #7a5e72;
    --rose: #8A5B7A;
    --rose-deep: #6E3F61;
    --pink: #F7A7C6;
    --gold: #B58F3E;
    --line: #e7d4dc;
    --danger: #c44a4a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Cormorant Garamond", "Times New Roman", serif;
    background:
      radial-gradient(120% 80% at 50% 0%, #fde8f0 0%, transparent 60%),
      linear-gradient(180deg, #fff4ec 0%, #f9e8f1 100%);
    color: var(--ink);
    min-height: 100vh;
  }
  #root { max-width: 1100px; margin: 0 auto; padding: 28px 22px 80px; }
  .head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .head h1 {
    font-family: "Cinzel", serif;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.16em;
    margin: 0;
    color: var(--rose-deep);
  }
  .head .eyebrow {
    font-family: "Cinzel", serif;
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--gold);
    text-transform: uppercase;
    display: block;
    margin-bottom: 6px;
  }
  .head .count {
    font-style: italic;
    color: var(--ink-soft);
    font-size: 15px;
  }

  /* Config warning */
  .warn {
    background: #fff3cd;
    border: 1px solid #f0d27a;
    color: #6b4f00;
    padding: 14px 18px;
    border-radius: 10px;
    font-family: system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.55;
    margin-bottom: 22px;
  }
  .warn code {
    background: rgba(0,0,0,0.06);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 12px;
  }

  /* Drop zone */
  .drop {
    border: 2px dashed var(--line);
    border-radius: 14px;
    padding: 36px 20px;
    text-align: center;
    background: rgba(255,255,255,0.55);
    transition: border-color .15s, background .15s;
    cursor: pointer;
    user-select: none;
    margin-bottom: 22px;
  }
  .drop:hover, .drop.over {
    border-color: var(--rose);
    background: rgba(247, 167, 198, 0.12);
  }
  .drop .big {
    font-family: "Cinzel", serif;
    font-size: 16px;
    letter-spacing: 0.18em;
    color: var(--rose-deep);
    margin-bottom: 6px;
  }
  .drop .sub {
    font-style: italic;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .drop input[type=file] { display: none; }
  .drop.busy { opacity: 0.7; pointer-events: none; }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 18px;
  }
  .card {
    position: relative;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 4px 14px -8px rgba(80,30,80,0.25);
    transition: transform .15s, box-shadow .15s, opacity .15s;
    display: flex; flex-direction: column;
  }
  .card[draggable=true] { cursor: grab; }
  .card.dragging { opacity: 0.4; }
  .card.drop-target { box-shadow: 0 0 0 2px var(--rose), 0 4px 14px -8px rgba(80,30,80,0.35); transform: translateY(-2px); }
  .card .thumb-wrap {
    position: relative;
    aspect-ratio: 3/4;
    border-radius: 8px;
    overflow: hidden;
    background: #f4e8f0;
  }
  .card .thumb-wrap img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .card .pos {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-family: "Cinzel", serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    padding: 3px 8px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
  }
  .card .del {
    position: absolute;
    top: 8px; right: 8px;
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 0;
    background: rgba(0,0,0,0.55);
    color: #fff;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity .15s, background .15s;
    backdrop-filter: blur(6px);
  }
  .card:hover .del { opacity: 1; }
  .card .del:hover { background: var(--danger); }
  .card .cap {
    margin-top: 8px;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 6px 8px;
    font-family: "Cormorant Garamond", serif;
    font-size: 14px;
    color: var(--ink);
    background: transparent;
    width: 100%;
    resize: none;
    min-height: 40px;
    transition: border-color .15s, background .15s;
    outline: none;
  }
  .card .cap::placeholder { color: #c8b3c1; font-style: italic; }
  .card .cap:hover { border-color: var(--line); }
  .card .cap:focus { border-color: var(--rose); background: #fffafc; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-style: italic;
    font-size: 16px;
  }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(20,10,20,0.92); color: #fff;
    padding: 10px 18px; border-radius: 999px;
    font-family: system-ui, sans-serif; font-size: 13px;
    box-shadow: 0 10px 30px -8px rgba(0,0,0,0.4);
    z-index: 100;
    animation: pop .25s ease-out;
  }
  .toast.err { background: var(--danger); }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, 8px); } }

  /* Confirm dialog */
  .modal-wrap {
    position: fixed; inset: 0;
    background: rgba(28,10,40,0.55);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .modal {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.5);
    text-align: center;
  }
  .modal h3 { margin: 0 0 8px; font-family: "Cinzel", serif; font-size: 16px; letter-spacing: 0.1em; color: var(--rose-deep); }
  .modal p { margin: 0 0 18px; color: var(--ink-soft); font-size: 15px; }
  .modal .row { display: flex; gap: 10px; justify-content: center; }
  .btn {
    appearance: none; border: 0; cursor: pointer;
    font-family: "Cinzel", serif; font-size: 12px; letter-spacing: 0.18em;
    padding: 10px 18px; border-radius: 8px;
    text-transform: uppercase;
    transition: background .15s, color .15s;
  }
  .btn-ghost { background: transparent; color: var(--ink-soft); }
  .btn-ghost:hover { background: rgba(0,0,0,0.05); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #a83a3a; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="../gallery-config.js"></script>
<script src="../gallery-store.js"></script>

</body>
</html>
