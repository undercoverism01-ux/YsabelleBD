<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Althea Ysabelle · A Magical 18th</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --pink: #F7A7C6;
    --fairy: #C6A1E6;
    --gold: #D7B26A;
    --gold-deep: #B58F3E;
    --cream: #FFF5EA;
    --blush: #FF66EE;
    --lav: #EADCF6;
    --rose: #8A5B7A;
    --rose-deep: #6E3F61;
    --body-ink: #5D4A5A;
    --sheet: #fff8f3;
    --shadow-rose: 0 24px 60px -24px rgba(138, 91, 122, 0.35), 0 6px 18px -8px rgba(138, 91, 122, 0.25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Cormorant Garamond", "Times New Roman", serif;
    color: var(--body-ink);
    background:
      radial-gradient(120% 80% at 50% 0%, #fde8f0 0%, transparent 60%),
      radial-gradient(120% 80% at 50% 100%, #efe2f6 0%, transparent 60%),
      linear-gradient(180deg, #fff4ec 0%, #f9e8f1 35%, #ede0f5 70%, #fff4ec 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,0.6), transparent 60%),
      radial-gradient(1.5px 1.5px at 78% 32%, rgba(255,255,255,0.5), transparent 60%),
      radial-gradient(1px 1px at 32% 68%, rgba(255,255,255,0.5), transparent 60%),
      radial-gradient(2px 2px at 88% 78%, rgba(255,255,255,0.5), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  #root { position: relative; z-index: 1; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fde8f0"/>
        <stop offset="100%" stop-color="#efe2f6"/>
      </linearGradient>
    </defs>
    <rect width="200" height="200" fill="url(#bg)"/>
    <g transform="translate(100 105)" fill="#8A5B7A" font-family="Allura, cursive" font-size="64" text-anchor="middle">A</g>
    <g transform="translate(100 140)" fill="#B58F3E" font-family="Cinzel, serif" font-size="9" letter-spacing="4" text-anchor="middle">A MAGICAL 18TH</g>
  </svg>
</template>
